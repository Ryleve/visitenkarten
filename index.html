<title>Rylevé · Digitale Visitenkarte</title>
<style>
:root{
  /* Rylevé Farbpalette */
  --rose-light:#EEDFE4; --mauve:#C49BA7; --rose-grey:#DACDD1; --berry:#936875;
  --petrol:#376372; --petrol-dark:#2E424C; --slate:#637B88; --blue-grey:#88A2AF; --blue-light:#D1DBDF;
  --grey-light:#E8E8E8; --sand:#D6AF80; --white:#FFFFFF;
  --bg:var(--petrol); --card:var(--white);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:var(--petrol-dark); } }
:root[data-theme="dark"]{ --bg:var(--petrol-dark); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--petrol-dark);
  font-family:Calibri,Carlito,"Helvetica Neue",-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.4;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:18px 16px 28px; -webkit-text-size-adjust:100%;
}
.brand{ color:var(--rose-light); text-align:center; margin:0 0 16px; }
.brand .name{ font-size:38px; font-weight:400; letter-spacing:.06em; line-height:1; margin:0; }
.brand .sub{ font-size:14px; letter-spacing:.3em; margin:9px 0 0; color:var(--blue-light); }
.brand::after{ content:""; display:block; width:36px; height:2px; background:var(--sand); margin:12px auto 0; border-radius:2px; }

.seg{ display:flex; width:100%; max-width:380px; background:rgba(255,255,255,.12); border-radius:12px; padding:3px; margin-bottom:14px; }
.seg button{
  flex:1 1 auto; border:0; background:transparent; color:var(--blue-light); font:inherit; font-size:14px; font-weight:600;
  padding:10px 8px; border-radius:10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.seg button[aria-selected="true"]{ background:var(--rose-light); color:var(--petrol-dark); }
.seg button:focus-visible{ outline:3px solid var(--white); outline-offset:-3px; }

.card{
  background:var(--card); border-radius:22px; width:100%; max-width:380px;
  padding:24px 24px 20px; display:flex; flex-direction:column; align-items:center;
  box-shadow:0 18px 40px rgba(46,66,76,.35); border-top:4px solid var(--mauve);
}
.logo{ height:52px; width:auto; margin:0 0 16px; display:block; }
.who{ text-align:center; margin:0 0 14px; }
.who .n{ font-size:21px; font-weight:600; color:var(--petrol-dark); margin:0; line-height:1.2; }
.who .r{ font-size:15px; color:var(--petrol); margin:3px 0 0; }
.who a{ color:var(--berry); text-decoration:none; }
.qr{ width:min(72vw,268px); height:auto; display:block; }
.qr path{ fill:var(--petrol-dark); }
.hidden{ display:none !important; }
.hint{ margin:16px 0 0; text-align:center; color:var(--petrol); font-size:15px; max-width:30ch; }
.hint strong{ color:var(--berry); font-weight:600; }

.sub-seg{ display:flex; gap:6px; margin-top:14px; }
.sub-seg button{
  border:1.5px solid var(--petrol); background:transparent; color:var(--petrol); font:inherit; font-size:14px; font-weight:600;
  padding:7px 14px; border-radius:999px; cursor:pointer;
}
.sub-seg button[aria-selected="true"]{ background:var(--petrol); color:var(--white); }
.sub-seg button:focus-visible{ outline:3px solid var(--mauve); outline-offset:2px; }

.actions{ width:100%; max-width:380px; margin-top:16px; display:flex; flex-direction:column; gap:10px; }
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:15px 18px; border-radius:14px; text-decoration:none; font-size:17px; font-weight:600;
  border:1.5px solid transparent; cursor:pointer; font-family:inherit; width:100%;
}
.btn.primary{ background:var(--rose-light); color:var(--petrol-dark); border-color:var(--mauve); }
.btn.ghost{ background:transparent; color:var(--rose-light); border-color:var(--mauve); }
.btn:focus-visible{ outline:3px solid var(--white); outline-offset:2px; }
.btn:active{ transform:scale(.985); }
.btn svg{ width:20px; height:20px; flex:none; }
.footer{ margin-top:20px; color:var(--blue-light); font-size:13px; text-align:center; }
.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px);
  background:var(--rose-light); color:var(--petrol-dark); padding:10px 16px; border-radius:12px; font-size:15px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){ .btn:active{ transform:none; } .toast{ transition:none; } }
</style>
</head>

    <h1 class="name">Rylevé</h1>
    <p class="sub">EXOWEAR</p>

  <div class="seg" role="tablist" aria-label="Karte wählen">

    <button role="tab" aria-selected="false" data-view="yen">Dr. Yen Dieu Pham</button>

  } catch(e) {}
  render();
})();
</script>
